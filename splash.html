<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            margin: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            overflow: hidden;
            animation: fadeIn 1.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .logo {
            font-size: 42px;
            font-weight: bold;
            color: #FF003C;
            text-shadow: 0 0 15px #FF003C, 0 0 30px #00FF57;
            animation: glow 2.5s infinite ease-in-out;
        }

        @keyframes glow {
            0% { text-shadow: 0 0 10px #FF003C, 0 0 20px #00FF57; }
            50% { text-shadow: 0 0 30px #00FF57, 0 0 50px #FF003C; }
            100% { text-shadow: 0 0 10px #FF003C, 0 0 20px #00FF57; }
        }

        .sub {
            font-size: 16px;
            color: #00FF57;
            margin-top: 10px;
            opacity: 0;
            animation: fadeUp 1.5s forwards 1s;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div style="text-align:center;">
        <div class="logo">⚡ BOOSTBRAIN</div>
        <div class="sub">AI Gaming Overlay</div>
    </div>
</body>
</html>
