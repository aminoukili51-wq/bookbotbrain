<!DOCTYPE html>
<html>
<head>
    <style>
        html, body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: transparent;
            overflow: hidden;
            animation: fadeInOverlay 1.2s ease-out; /* 🔥 smooth fade-in */
        }

        @keyframes fadeInOverlay {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 🔥 Scanline effect */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: repeating-linear-gradient(
                rgba(0, 0, 0, 0) 0px,
                rgba(0, 0, 0, 0) 2px,
                rgba(0, 255, 87, 0.05) 3px
            );
            animation: scanMove 6s linear infinite;
        }

        @keyframes scanMove {
            0% { transform: translateY(-10%); }
            100% { transform: translateY(10%); }
        }

        /* 🔥 Main box */
        .box {
            width: 400px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.75);
            border-radius: 14px;
            border: 1px solid rgba(255, 0, 60, 0.6);
            box-shadow:
                0 0 15px rgba(255, 0, 60, 0.6),
                0 0 25px rgba(255, 0, 60, 0.4),
                0 0 10px rgba(255, 0, 60, 0.3); /* 🔥 glow all around */
            backdrop-filter: blur(10px);
            color: #FF003C;
            position: relative;
            -webkit-app-region: drag;
        }

        /* 🔥 Logo */
        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #FF003C;
            text-shadow: 0 0 12px #FF003C, 0 0 25px #00FF57;
            animation: neonPulse 2.5s infinite;
        }

        @keyframes neonPulse {
            0% { text-shadow: 0 0 6px #FF003C; }
            50% { text-shadow: 0 0 25px #00FF57; }
            100% { text-shadow: 0 0 6px #FF003C; }
        }

        /* 🔘 Close button */
        .close-btn {
            position: absolute;
            top: 6px;
            right: 10px;
            color: #aaa;
            font-size: 16px;
            cursor: pointer;
            transition: color 0.2s ease;
            -webkit-app-region: no-drag;
        }
        .close-btn:hover {
            color: #FF003C;
        }

        /* ⚙️ Settings button */
        .settings-btn {
            position: absolute;
            top: 6px;
            right: 40px;
            color: #00FF57;
            font-size: 18px;
            cursor: pointer;
            -webkit-app-region: no-drag;
            transition: 0.2s;
        }
        .settings-btn:hover {
            color: #FF003C;
        }

        /* 🔘 Checkbox styling */
        .checkbox {
            display: flex;
            align-items: center;
            margin-top: 8px;
            cursor: pointer;
            -webkit-app-region: no-drag;
        }

        .checkbox input {
            width: 18px;
            height: 18px;
            margin-right: 8px;
            accent-color: #00FF57;
        }

        /* 🔤 Text styles */
        .title {
            margin-top: 10px;
            font-size: 16px;
            color: #00FF57;
        }

        .bullet {
            font-size: 14px;
            margin-left: 10px;
            color: #FFFFFF;
        }

        .header {
            font-size: 22px;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="close-btn" onclick="window.close()">✖</div>
        <div class="settings-btn">⚙️</div>

        <div class="logo">⚡ BOOSTBRAIN</div>

        <div class="header">
            <div>3 - 5</div>
            <div>0:35</div>
        </div>

        <div class="title">WIN CHANCE:</div>
        <div style="font-size:26px; color:#FF003C;">41%</div>

        <div class="title">BOOST COACH:</div>
        <div class="bullet">• Max 40 boost per play</div>
        <div class="bullet">• Save 20 for counter plays</div>

        <div class="title" style="color:#FF003C;">CLUTCH MODE:</div>
        <div class="bullet">Fake challenge → push</div>

        <div class="title">SETTINGS:</div>

        <label class="checkbox">
            <input type="checkbox">
            <span style="color:white;">Show boost tips</span>
        </label>

        <label class="checkbox">
            <input type="checkbox">
            <span style="color:white;">Show win chance</span>
        </label>

        <label class="checkbox">
            <input type="checkbox">
            <span style="color:white;">Enable clutch alerts</span>
        </label>
    </div>
</body>
</html>
